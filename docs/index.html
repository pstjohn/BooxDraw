<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BooxDraw Room Code</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f4;
        --panel: #ffffff;
        --text: #161616;
        --muted: #5f6468;
        --border: #d8d8d2;
        --primary: #2458d3;
        --primary-text: #ffffff;
        --danger: #9f1d1d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2023;
          --panel: #2a2b2f;
          --text: #f2f2ee;
          --muted: #b8bbb8;
          --border: #484a50;
          --primary: #7da0ff;
          --primary-text: #101216;
          --danger: #ff8a8a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 440px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.45;
      }

      label {
        display: grid;
        gap: 6px;
        margin: 14px 0;
        color: var(--muted);
        font-size: 14px;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      input[name="code"] {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 22px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 14px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button[type="submit"] {
        flex: 1;
        border-color: var(--primary);
        background: var(--primary);
        color: var(--primary-text);
        font-weight: 650;
      }

      button.secondary {
        flex: 1;
      }

      .error {
        min-height: 20px;
        margin-top: 14px;
        color: var(--danger);
        font-size: 14px;
      }

      .generated {
        display: none;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }

      .generated.is-visible {
        display: grid;
        gap: 14px;
      }

      .generated h2 {
        margin: 0;
        font-size: 18px;
      }

      .code-output {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .link-output {
        display: block;
        overflow-wrap: anywhere;
        color: var(--primary);
      }

      .generated .actions {
        margin-top: 0;
      }

      .note {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BooxDraw Room Code</h1>
      <p>
        Generate a desktop Excalidraw room for the tablet, or enter a tablet
        code to join an existing room.
      </p>

      <form id="room-form">
        <label>
          Code
          <input
            name="code"
            autocomplete="off"
            inputmode="latin"
            maxlength="11"
            placeholder="ABCDE-12345"
            required
          />
        </label>

        <div class="actions">
          <button type="submit">Join Room</button>
          <button type="button" class="secondary" id="generate-room">
            Generate Code + URL
          </button>
        </div>

        <div class="error" id="error" role="alert"></div>
      </form>

      <section class="generated" id="generated-room" aria-live="polite">
        <h2>Desktop room</h2>
        <div>
          <label>Tablet code</label>
          <div class="code-output" id="generated-code"></div>
        </div>
        <div>
          <label>Desktop URL</label>
          <a class="link-output" id="generated-link" href="#"></a>
        </div>
        <div class="actions">
          <button type="button" id="open-generated-room">
            Open Excalidraw
          </button>
          <button type="button" id="copy-generated-link">Copy URL</button>
        </div>
      </section>

      <p class="note">
        Codes use today's date and are deterministic. URLs point to the public
        Excalidraw app; this page does not require a forked desktop client.
      </p>
    </main>

    <script>
      const ROOM_CODE_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
      const ROOM_CODE_LENGTH = 10;
      const ROOM_CODE_VERSION = "booxdraw-room-v1";
      const EXCALIDRAW_ORIGIN = "https://excalidraw.com";

      const encoder = new TextEncoder();
      const form = document.querySelector("#room-form");
      const codeInput = form.elements.code;
      const errorEl = document.querySelector("#error");
      const generateButton = document.querySelector("#generate-room");
      const generatedRoom = document.querySelector("#generated-room");
      const generatedCodeEl = document.querySelector("#generated-code");
      const generatedLinkEl = document.querySelector("#generated-link");
      const openGeneratedRoomButton = document.querySelector(
        "#open-generated-room",
      );
      const copyGeneratedLinkButton = document.querySelector(
        "#copy-generated-link",
      );
      let generatedLink = "";

      const normalizeRoomCode = (code) =>
        code
          .toUpperCase()
          .replace(/[IL]/g, "1")
          .replace(/O/g, "0")
          .replace(/[^0-9A-Z]/g, "");

      const formatRoomCode = (code) => {
        const normalized = normalizeRoomCode(code);
        return normalized.length > 5
          ? `${normalized.slice(0, 5)}-${normalized.slice(5, 10)}`
          : normalized;
      };

      const isValidRoomCode = (code) => {
        const normalized = normalizeRoomCode(code);
        return (
          normalized.length === ROOM_CODE_LENGTH &&
          [...normalized].every((char) => ROOM_CODE_ALPHABET.includes(char))
        );
      };

      const getRoomCodeDate = (date = new Date()) => {
        const year = date.getFullYear();
        const month = `${date.getMonth() + 1}`.padStart(2, "0");
        const day = `${date.getDate()}`.padStart(2, "0");
        return `${year}-${month}-${day}`;
      };

      const generateRoomCode = () => {
        const bytes = new Uint8Array(ROOM_CODE_LENGTH);
        window.crypto.getRandomValues(bytes);

        return Array.from(bytes, (byte) => ROOM_CODE_ALPHABET[byte & 31]).join(
          "",
        );
      };

      const bytesToHex = (bytes) =>
        Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join(
          "",
        );

      const bytesToBase64Url = (bytes) => {
        let binary = "";
        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }
        return window
          .btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      };

      const deriveRoom = async (code, date) => {
        const normalized = normalizeRoomCode(code);
        const digest = new Uint8Array(
          await window.crypto.subtle.digest(
            "SHA-256",
            encoder.encode(`${ROOM_CODE_VERSION}:${date}:${normalized}`),
          ),
        );

        return {
          roomId: bytesToHex(digest.slice(0, 10)),
          roomKey: bytesToBase64Url(digest.slice(10, 26)),
        };
      };

      const getRoomLink = ({ roomId, roomKey }) =>
        `${EXCALIDRAW_ORIGIN}/#room=${roomId},${roomKey}`;

      const joinRoom = async () => {
        const code = normalizeRoomCode(codeInput.value);
        const date = getRoomCodeDate();

        if (!isValidRoomCode(code)) {
          errorEl.textContent = "Enter a valid 10-character room code.";
          return;
        }

        errorEl.textContent = "";
        const { roomId, roomKey } = await deriveRoom(code, date);
        window.location.href = getRoomLink({ roomId, roomKey });
      };

      const generateRoom = async () => {
        const code = generateRoomCode();
        const date = getRoomCodeDate();
        const room = await deriveRoom(code, date);
        generatedLink = getRoomLink(room);

        codeInput.value = formatRoomCode(code);
        generatedCodeEl.textContent = formatRoomCode(code);
        generatedLinkEl.textContent = generatedLink;
        generatedLinkEl.href = generatedLink;
        generatedRoom.classList.add("is-visible");
        errorEl.textContent = "";
      };

      codeInput.addEventListener("input", () => {
        codeInput.value = formatRoomCode(codeInput.value);
        codeInput.setSelectionRange(
          codeInput.value.length,
          codeInput.value.length,
        );
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        joinRoom().catch((error) => {
          console.error(error);
          errorEl.textContent = "Could not create the room link.";
        });
      });

      generateButton.addEventListener("click", () => {
        generateRoom().catch((error) => {
          console.error(error);
          errorEl.textContent = "Could not generate the room link.";
        });
      });

      openGeneratedRoomButton.addEventListener("click", () => {
        if (generatedLink) {
          window.open(generatedLink, "_blank", "noopener,noreferrer");
        }
      });

      copyGeneratedLinkButton.addEventListener("click", async () => {
        if (!generatedLink) {
          return;
        }

        try {
          await navigator.clipboard.writeText(generatedLink);
          copyGeneratedLinkButton.textContent = "Copied";
          window.setTimeout(() => {
            copyGeneratedLinkButton.textContent = "Copy URL";
          }, 1500);
        } catch (error) {
          console.error(error);
          errorEl.textContent = "Could not copy the URL.";
        }
      });

      const initialCode = new URLSearchParams(window.location.search).get(
        "code",
      );
      const hashCode = window.location.hash.slice(1);
      if (initialCode || hashCode) {
        codeInput.value = formatRoomCode(initialCode || hashCode);
      }
    </script>
  </body>
</html>
